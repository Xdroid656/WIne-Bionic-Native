name: Unpack DEB and Publish TAR.XZ

on:
  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 分支'
        required: false
        default: 'proton'
        type: choice
        options:
        - proton
        - staging
        
      wine_version:
        description: 'Wine 版本 (例如 9.22，或 latest)'
        required: false
        default: 'latest'
        type: string
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract DEB and Pack TAR.XZ
        run: |
          # 1. Verify the .deb file exists in root before proceeding
          if [ ! -f ./bionic_native.11.15.deb ]; then
            echo "Error: bionic_native.11.15.deb not found in workspace!"
            exit 1
          fi

          # 2. Create workspace directory
          mkdir workspace
          
          # 3. Unpack the Debian package
          dpkg-deb -x ./bionic_native.11.15.deb workspace/
          
          # 4. Compress contents into .tar.xz (including hidden files without dir changing bugs)
          tar -cJf bionic_native.11.15.tar.xz -C workspace .

      - name: Post to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: bionic_native.11.15.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
